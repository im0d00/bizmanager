[variables]
NIXPACKS_NODE_VERSION = "20"

[phases.setup]
nixPkgs = ["nodejs_20", "npm", "python3"]

[phases.install]
cmds = []

[phases.build]
cmds = []

[start]
cmd = "bash start.sh"
