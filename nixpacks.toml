# Nixpacks configuration for Railway deployment
# This ensures Node.js is properly installed before running start.sh

[variables]
NIXPACKS_NODE_VERSION = "20"

[phases.setup]
nixPkgs = ["nodejs_20", "npm", "python3"]

[phases.install]
# Skip automatic install - start.sh handles it

[phases.build]
# Skip build phase - start.sh handles everything

[start]
cmd = "bash start.sh"
